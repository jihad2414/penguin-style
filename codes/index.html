<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Penguin style</title>
    <!-- tailwind css link -->
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
    <!-- font awesome link-->
     <script src="https://kit.fontawesome.com/e913bdd378.js" crossorigin="anonymous"></script>
    <!-- google font link -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Roboto:ital,wght@0,100..900;1,100..900&display=swap" rel="stylesheet">
    <!-- style css-->
     <style>
        .roboto{
         font-family: "Roboto", sans-serif;
        }
        .bebas-neue{
            font-family: "Bebas Neue", sans-serif;
        }
     </style>
</head>
<body>
    <!-- header start here -->
    <header class="bg-[#FFFBF0]  p-10">
        <!-- navbar start here -->
         <nav class="flex items-center justify-between ">
            <div>
                <img class="w-[291.11px]" src="/icons/logo.png" alt="">
            </div>
            <div>
                <ul class="flex roboto ">
                    <li><a class="ml-8 text-1xl font-medium" href="#">Home</a></li>
                    <li><a class="ml-8 text-1xl font-medium" href="#">Product</a></li>
                    <li><a class="ml-8 text-1xl font-medium" href="#">About us</a></li>
                    <li><a class="ml-8 text-1xl font-medium" href="#">Contact</a></li>
                </ul>
            </div>
         </nav>
        <!-- banner start here -->
         <div class="flex justify-between items-center py-10">
            <div class="">
                <h1 class="p-2 uppercase bebas-neue text-7xl"> <span class="text-[#FABE4C]">Be the Penguins</span>
                    <br> of Winter
                </h1>
                <p class="p-2 text-[#3E3E3E] text-[1rem] font-normal">Lorem Ipsum is simply dummy text of the printing <br>
                and typesetting industry.
                </p>
                <button class=" text-white roboto font-semibold items-center py-5 px-9 rounded-lg bg-linear-to-r from-[#85A019]  to-[#99ad48]"><i class="fa-solid fa-cart-shopping"></i> Buy Now</button>
            </div>
            <div>
                <img src="/images/model.png" alt="">
            </div>
         </div>
    </header>

    <!-- main start here -->
     <main>

     </main>
     
</body>
</html>
